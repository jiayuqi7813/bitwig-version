[package]
name = "desktop-tauri"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
bitwig_core = { path = "../../../crates/core" }
git_backend = { path = "../../../crates/git_backend" }
api = { path = "../../../crates/api" }
dawproject = { path = "../../../crates/dawproject" }
diff_engine = { path = "../../../crates/diff_engine" }

# keep tauri optional for environments lacking native dependencies
[dependencies.tauri]
version = "1"
features = ["shell-open"]
optional = true

[features]
default = []
with-tauri = ["tauri"]
